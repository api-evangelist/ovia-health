name: Ovia Health
description: >-
  Ovia Health (by Labcorp) is a digital women's and family health platform delivering
  evidence-based programs, personalized data insights, and Care Team support across
  reproductive health, fertility, pregnancy, postpartum, parenting, and menopause. It is
  offered to individuals through consumer mobile apps (Ovia, Ovia Pregnancy, Ovia Fertility)
  and to employers and health plans as a benefit, and its apps sync with consumer health
  platforms including Apple Health and Google Fit. Ovia Health does not publish a public
  developer API, developer portal, SDK, or machine-readable API specification; this profile
  was added to the API Evangelist network as a portfolio lead and reflects the honest result
  of an enrichment pass that found no public API surface, only a consumer/enterprise product.
